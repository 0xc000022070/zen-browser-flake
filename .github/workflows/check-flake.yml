name: Nix flake check

on:
  push:
    branches: [main]
    paths:
      - "**/*.nix"
      - "flake.lock"
      - "sources.json"

  pull_request:
    paths:
      - "**/*.nix"
      - "flake.lock"
      - "sources.json"

  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

jobs:
  flake-check:
    name: Check flake
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Setup Nix cache
        uses: DeterminateSystems/flakehub-cache-action@main

      - name: Check flake
        run: nix flake check --debug

  # Users follow nixos-unstable and home-manager master, which move long
  # before we bump the lock: wrapper.nix internals broke eval twice (#384,
  # #386), HM option removals broke signed Darwin (#403). Runs daily because
  # zen-update pushes with github.token, which triggers no workflows.
  flake-check-unstable:
    name: Check flake (nixos-unstable + home-manager master, eval only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check flake against nixos-unstable and home-manager master
        run: nix flake check --no-build --all-systems --no-write-lock-file --override-input nixpkgs github:NixOS/nixpkgs/nixos-unstable --override-input home-manager github:nix-community/home-manager

  flake-check-darwin:
    name: Check flake (aarch64-darwin)
    if: github.event_name != 'schedule'
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Setup Nix cache
        uses: DeterminateSystems/flakehub-cache-action@main

      - name: Check flake
        run: nix flake check --debug

      # /usr/bin/codesign is not reachable from a sandboxed derivation, so the
      # signature is verified here instead of in checks.aarch64-darwin.signed.
      - name: Verify upstream code signature
        run: |
          pkg="$(nix build --no-link --print-out-paths .#beta-unwrapped)"
          app="$pkg/Applications/$(nix eval --raw .#beta-unwrapped.applicationName).app"

          /usr/bin/codesign --verify --deep --strict "$app"

          # --verify also passes on an ad-hoc re-sign, so assert the chain itself.
          info="$(/usr/bin/codesign --display --verbose=4 "$app" 2>&1)"
          echo "$info"

          grep -q '^Authority=Developer ID Application:' <<<"$info"
          grep -q '^TeamIdentifier=[A-Z0-9]\{10\}$' <<<"$info"

          if grep -q 'Signature=adhoc' <<<"$info"; then
            echo "bundle is ad-hoc signed: the upstream signature was replaced" >&2
            exit 1
          fi
